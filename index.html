<body>
<title>Level Up Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one-column phone app, scrolling screen + fixed 5-tab bar; the player card (level + XP) is the hero on Home. */
:root{
  --bg:#EDEFF7; --surface:#FFFFFF; --surface-2:#E2E5F2; --ink:#191C3A; --muted:#5F6488; --line:#D4D8EA;
  --accent:#4A43E0; --accent-ink:#FFFFFF; --accent-soft:#E3E1FF;
  --xp:#E59A0B; --xp-soft:#FFF0CF; --good:#0F9466; --bad:#D9363E;
  --hero:#221D6E; --hero-ink:#F3F1FF; --hero-muted:#B7B2F0; --hero-track:#3A3494;
  --cell:#DCE0EE; --cell-future:#ECEEF6;
  --shadow:0 1px 2px rgba(25,28,58,.06),0 6px 18px rgba(25,28,58,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-pixel:"Silkscreen",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1128; --surface:#191C3B; --surface-2:#23274D; --ink:#ECEEFF; --muted:#A0A5CC; --line:#2C315C;
  --accent:#8F89FF; --accent-ink:#12132B; --accent-soft:#2C2A63;
  --xp:#FFC24B; --xp-soft:#3D3214; --good:#3BD49A; --bad:#FF6B71;
  --hero:#2A2575; --hero-ink:#F3F1FF; --hero-muted:#B9B4F5; --hero-track:#423C9E;
  --cell:#262A52; --cell-future:#1D2043;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1128; --surface:#191C3B; --surface-2:#23274D; --ink:#ECEEFF; --muted:#A0A5CC; --line:#2C315C;
  --accent:#8F89FF; --accent-ink:#12132B; --accent-soft:#2C2A63;
  --xp:#FFC24B; --xp-soft:#3D3214; --good:#3BD49A; --bad:#FF6B71;
  --hero:#2A2575; --hero-ink:#F3F1FF; --hero-muted:#B9B4F5; --hero-track:#423C9E;
  --cell:#262A52; --cell-future:#1D2043;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:19px;font-weight:700}
p{margin:0}
.tnum{font-variant-numeric:tabular-nums}

#view{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top>div{min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);flex:none}
.icon-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn svg{width:20px;height:20px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-head .link{font-size:13px;font-weight:600;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}

/* hero player card */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;background:
  repeating-linear-gradient(0deg,transparent 0 10px,rgba(255,255,255,.05) 10px 12px),repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.05) 10px 12px);transform:rotate(12deg);pointer-events:none}
.hero-row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.lvl{width:68px;height:68px;border-radius:18px;background:var(--xp);color:#2A1B00;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.lvl small{font-family:var(--f-pixel);font-size:11px;line-height:1}
.lvl b{font-family:var(--f-pixel);font-size:30px;line-height:1;font-weight:700}
.hero-meta{min-width:0;flex:1}
.rank{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1}
.hero-sub{font-size:13px;color:var(--hero-muted);margin-top:2px}
.xpbar{height:14px;border-radius:7px;background:var(--hero-track);margin-top:16px;overflow:hidden;position:relative;z-index:1}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--xp) 0 14px,#F7B53A 14px 16px);border-radius:7px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xp-line{display:flex;justify-content:space-between;font-family:var(--f-pixel);font-size:11px;color:var(--hero-muted);margin-top:8px;position:relative;z-index:1}
.year{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.18);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--hero-muted);position:relative;z-index:1}
.year-track{flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.year-track span{height:6px;border-radius:2px;background:var(--hero-track)}
.year-track span.on{background:var(--hero-muted)}

/* quest tiles */
.quests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quest{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-width:0}
.quest svg.ring{width:44px;height:44px}
.quest b{font-family:var(--f-display);font-size:20px;line-height:1}
.quest span{font-size:12px;color:var(--muted);font-weight:600}

.starter{background:var(--xp-soft);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:13px}
.starter p{flex:1;min-width:0}
.starter button{font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

.focus-in{width:100%;border:1px dashed var(--line);background:transparent;border-radius:14px;padding:12px 14px;font-size:16px;font-family:var(--f-display);font-weight:600}
.focus-in::placeholder{color:var(--muted);font-weight:500}

/* rows */
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.row .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-pixel);font-size:10px;padding:3px 6px;border-radius:6px;background:var(--xp-soft);color:var(--ink);white-space:nowrap;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

.chk{width:34px;height:34px;border-radius:11px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .15s,background .15s,border-color .15s;color:#fff}
.chk svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:.18s}
.chk.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.chk.on svg{opacity:1;transform:scale(1)}
.chk:active{transform:scale(.88)}
.mini-btn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini-btn svg{width:18px;height:18px}

/* habits */
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.ov-stats div{min-width:0}
.ov-stats b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1}
.ov-stats span{font-size:11px;color:var(--muted);font-weight:600}
.matrix{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,28px);gap:6px 5px;align-items:center}
.matrix .hd{font-family:var(--f-pixel);font-size:10px;color:var(--muted);text-align:center}
.matrix .hd.today{color:var(--accent)}
.matrix .hn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcell{width:28px;height:28px;border-radius:8px;background:var(--cell)}
.mcell.on{background:var(--c)}
.mcell.out{background:transparent;border:1px dashed var(--line)}
.habit{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.habit-head{display:flex;gap:12px;align-items:center}
.habit-head .grow{flex:1;min-width:0}
.habit-head h3{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.hstats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.hstats b{color:var(--ink);font-variant-numeric:tabular-nums}
.big-chk{width:52px;height:52px;border-radius:16px}
.big-chk svg{width:26px;height:26px}
.grid{display:grid;gap:3px}
.grid.dense{grid-template-columns:repeat(auto-fill,minmax(9px,1fr))}
.grid.roomy{grid-template-columns:repeat(auto-fill,minmax(20px,1fr));gap:5px}
.sq{aspect-ratio:1;max-width:100%;border-radius:2px;background:var(--cell);transition:background .15s,transform .15s}
.grid.roomy .sq{border-radius:5px}
.sq.on{background:var(--c)}
.sq.future{background:var(--cell-future)}
.sq.pre{opacity:.55}
.sq.today{outline:2px solid var(--ink);outline-offset:1px}
.sq.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.6)}}
.grid-foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.progress{height:6px;border-radius:3px;background:var(--cell);overflow:hidden}
.progress i{display:block;height:100%;background:var(--c,var(--accent));border-radius:3px}

/* tasks */
.datenav{display:flex;align-items:center;gap:8px}
.datenav .lbl{flex:1;text-align:center;font-weight:700;font-family:var(--f-display);font-size:16px}
.task-sum{display:flex;align-items:center;gap:14px}
.task-sum .progress{flex:1;height:10px;border-radius:5px}
.sec-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 2px;display:flex;gap:8px;align-items:center}
.steps{padding:0 14px 12px 60px;display:flex;flex-direction:column;gap:6px;border-top:0}
.step{display:flex;align-items:center;gap:10px;font-size:14px;text-align:left;padding:4px 0}
.step .chk{width:24px;height:24px;border-radius:8px}
.step .chk svg{width:14px;height:14px}
.step.on span{color:var(--muted);text-decoration:line-through}
.row-wrap{border-top:1px solid var(--line)}
.row-wrap:first-child{border-top:0}
.row-wrap .row{border-top:0}

/* study */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dial{position:relative;width:220px;height:220px;max-width:100%}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.clock{font-family:var(--f-pixel);font-size:38px;font-weight:700;letter-spacing:.02em}
.dial-sub{font-size:13px;color:var(--muted);font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.subj-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.subj-chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink);min-height:48px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--good);color:#fff}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.wide{width:100%}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--good)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-pixel);font-size:9px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* schedule */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.wd small{font-size:11px;font-weight:700;color:var(--muted)}
.wd b{font-family:var(--f-display);font-size:18px;line-height:1}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd i.has{background:var(--accent)}
.wd.today b{color:var(--accent)}
.wd.on{background:var(--accent);border-color:var(--accent)}
.wd.on small,.wd.on b{color:var(--accent-ink)}
.wd.on i.has{background:var(--accent-ink)}
.tl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-family:var(--f-pixel);font-size:9px;color:var(--muted);padding:3px 0 0 8px}
.ev{position:absolute;border-radius:10px;padding:6px 8px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-left:4px solid var(--c);overflow:hidden;text-align:left;font-size:12px;line-height:1.25;min-width:0}
.ev b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev span{color:var(--muted)}
.ev.imp{box-shadow:inset 0 0 0 2px var(--bad)}
.ev .fl,.flag{display:inline-flex;vertical-align:-2px;color:var(--bad)}
.ev .fl svg,.flag svg{width:13px;height:13px;fill:currentColor}
.allday{display:flex;flex-direction:column;gap:6px}

async function flush(){
 if(!DB||flushing)return;flushing=true;
 try{
  while(dirtyCore||dirtyYears.size){
   if(dirtyCore){dirtyCore=false;const{sessions,...core}=S;await DB.doc(`data/users/${UID}/core`).set(JSON.parse(JSON.stringify(core)))}
   for(const y of [...dirtyYears]){dirtyYears.delete(y);await DB.doc(`data/users/${UID}/study-${y}`).set({sessions:S.sessions.filter(x=>new Date(x.start).getFullYear()==y)})}
  }
  syncMsg="Synced to your Claude account";
 }catch(e){syncMsg="Saved on this device (account sync paused)"}
 flushing=false;
}
function allYears(){const ys=new Set(S.sessions.map(x=>new Date(x.start).getFullYear()));ys.forEach(y=>dirtyYears.add(y))}
async function pull(initial){
 if(!DB||dirtyCore||flushing)return;
 try{
  const snap=await DB.collection(`data/users/${UID}`).get();
  let core=null,sess=[];
  snap.docs.forEach(d=>{if(!d.exists)return;const v=d.data();if(d.id==="core")core=v;else if(d.id.startsWith("study-"))sess=sess.concat(v.sessions||[])});
  if(core&&(core.updatedAt||0)>(S.updatedAt||0)){
   S=migrate(JSON.parse(JSON.stringify(core)));S.sessions=sess;saveLocal();render();
  }else if(initial&&(!core||(S.updatedAt||0)>(core.updatedAt||0))&&S.updatedAt){dirtyCore=true;allYears();scheduleRemote()}
  syncMsg="Synced to your Claude account";
 }catch(e){}
}

/* ---------- NEWS ---------- */
const fmtStart=iso=>{const d=new Date(iso);const t=fmtTs(d.getTime());const k=ymd(d),tk=today();return (k===tk?"Today":k===addDays(tk,1)?"Tomorrow":d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))+" "+t};
function teamGame(a){return FEED&&(FEED.games||[]).find(g=>g.home===a||g.away===a)}
function teamNext(a){return FEED&&(FEED.upcoming||[]).filter(g=>new Date(g.start)>Date.now()-3*36e5).find(g=>g.home===a||g.away===a)}
function confRank(a){const st=FEED&&FEED.standings;if(!st||!st[a])return null;const c=(TEAMS[a]||[])[2];const pct=x=>{const r=st[x];return r&&r.w+r.l?r.w/(r.w+r.l):0};const list=Object.keys(st).filter(x=>(TEAMS[x]||[])[2]===c).sort((x,y)=>pct(y)-pct(x)||st[y].w-st[x].w);return {r:st[a],rank:list.indexOf(a)+1,conf:c==="E"?"East":"West"}}
const ord=n=>n+(["th","st","nd","rd"][(n%100-20)%10]||["th","st","nd","rd"][n%100]||"th");
function gameRow(g,inset){
 const hs=g.score?g.score.home:null,as=g.score?g.score.away:null,fin=g.status==="final";
 const side=(a,sc,op)=>`<div class="side ${fin&&sc<op?"lose":""}">${tb(a)}<span class="nm">${esc(tShort(a))}</span>${sc!=null?`<span class="pts">${sc}</span>`:""}</div>`;
 const st=fin?"Final":g.status==="live"?`<span class="live">${esc(g.clock||"Live")}</span>`:esc(fmtStart(g.start));
 return `<button class="game ${inset?"inset":""}" data-act="game" data-id="${esc(g.id)}"><div class="sides">${side(g.away,as,hs)}${side(g.home,hs,as)}</div><div class="st">${st}${g.players?`<span style="color:var(--accent)">Box score</span>`:""}</div></button>`;
}

function boxSheet(id){

  ${list.slice().sort((x,y)=>(y.pts||0)-(x.pts||0)).map(p=>`<tr><td>${esc(p.name)}${p.pos?` <span class="muted" style="font-size:11px">${esc(p.pos)}</span>`:""}</td><td class="${p.pts===M.pts?"hi":""}">${p.pts??0}</td><td class="${p.reb===M.reb?"hi":""}">${p.reb??0}</td><td class="${p.ast===M.ast?"hi":""}">${p.ast??0}</td><td>${p.stl??0}</td><td>${p.blk??0}</td><td>${esc(p.fg||"–")}</td><td>${esc(p.tp||"–")}</td><td>${esc(p.ft||"–")}</td><td>${p.pm>0?"+":""}${p.pm??"–"}</td></tr>`).join("")}</tbody></table></div></div>`};
 const d=ymd(new Date(g.start));

function timerElapsed(){const t=S.timer;if(!t)return 0;return t.accum+(t.running?Date.now()-t.startedAt:0)}
function weekStart(d){const x=parse(d),w=(x.getDay()+6)%7;return addDays(d,-w)}
function studyChart(){
 const ws=weekStart(today()),days=Array.from({length:7},(_,i)=>addDays(ws,i));
 const per=days.map(d=>{const by={};S.sessions.filter(x=>ymd(new Date(x.start))===d).forEach(x=>by[x.s]=(by[x.s]||0)+x.min);return by});
 const tot=per.map(b=>Object.values(b).reduce((a,c)=>a+c,0)),max=Math.max(60,...tot),W=320,H=150,top=18,bot=20,bw=26,gap=(W-7*bw)/7;
 const step=max>240?120:60,ticks=[];for(let v=step;v<=max;v+=step)ticks.push(v);
 const yv=v=>H-bot-(v/max)*(H-bot-top);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Study minutes this week">`;
 ticks.forEach(v=>{s+=`<line x1="0" x2="${W}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W}" y="${yv(v)-3}" text-anchor="end">${v/60}h</text>`});
 days.forEach((d,i)=>{const x=gap/2+i*(bw+gap);let y=H-bot;Object.entries(per[i]).forEach(([sid,m])=>{const h=(m/max)*(H-bot-top);y-=h;s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0)}" rx="3" fill="${subjOf(sid).color}"/>`});
  if(!tot[i])s+=`<rect x="${x}" y="${H-bot-3}" width="${bw}" height="3" rx="1.5" fill="var(--cell)"/>`;
  if(tot[i])s+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="fill:var(--ink)">${Math.round(tot[i])}</text>`;
  s+=`<text x="${x+bw/2}" y="${H-5}" text-anchor="middle"${d===today()?' style="fill:var(--accent)"':""}>${DOW[parse(d).getDay()].slice(0,2).toUpperCase()}</text>`});
 return s+"</svg>";
}

function renderSchedule(){

 // simple overlap columns

 const ncol=Math.max(1,cols.length);

function openSheet(title,body,bind){
 const r=$("#sheetRoot");
 r.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">${I.x}</button></div><form class="sheet-body" novalidate>${body}</form></div>`;
 r.hidden=false;r.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeSheet));
 const f=r.querySelector("form");f.addEventListener("submit",e=>e.preventDefault());
 f.addEventListener("click",e=>{const b=e.target.closest(".pick button");if(!b)return;e.preventDefault();const g=b.parentElement;if(g.dataset.multi!=null)b.classList.toggle("on");else{g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}g.dispatchEvent(new Event("pick",{bubbles:true}))});
 bind&&bind(f);requestAnimationFrame(()=>requestAnimationFrame(()=>r.classList.add("open")));
}
function closeSheet(){const r=$("#sheetRoot");r.classList.remove("open");setTimeout(()=>{r.hidden=true;r.innerHTML=""},220)}

const pickMulti=(name,opts,vals)=>`<div class="pick" data-name="${name}" data-multi>${opts.map(([v,l])=>`<button type="button" data-v="${v}" class="${vals.map(String).includes(String(v))?"on":""}">${l}</button>`).join("")}</div>`;
const colorPick=(val)=>`<div class="pick colors" data-name="color">${COLORS.map(c=>`<button type="button" data-v="${c}" style="--c:${c}" class="${c===val?"on":""}" aria-label="Color ${c}"></button>`).join("")}</div>`;
const getPick=(f,n)=>{const b=f.querySelector(`[data-name="${n}"] .on`);return b?b.dataset.v:null};
const getMulti=(f,n)=>[...f.querySelectorAll(`[data-name="${n}"] .on`)].map(b=>b.dataset.v);

/* ---------- actions ---------- */
function toggleTask(id,ev){
 const d=UI.taskDate,x=S.tasks.find(t=>t.id===id);if(!x)return;
 act(()=>{S.taskDone[d]=S.taskDone[d]||{};S.stepDone[d]=S.stepDone[d]||{};
  if(S.taskDone[d][id]!=null){delete S.taskDone[d][id];if(x.steps&&x.steps.length)S.stepDone[d][id]=[]}
  else{S.taskDone[d][id]=x.xp;if(x.steps&&x.steps.length)S.stepDone[d][id]=x.steps.map(s=>s.id)}
  if(!Object.keys(S.taskDone[d]).length)delete S.taskDone[d];
 },x.name,ev);
}
function toggleStep(id,sid,ev){
 const d=UI.taskDate,x=S.tasks.find(t=>t.id===id);if(!x)return;
 act(()=>{S.stepDone[d]=S.stepDone[d]||{};S.taskDone[d]=S.taskDone[d]||{};const arr=new Set(S.stepDone[d][id]||[]);arr.has(sid)?arr.delete(sid):arr.add(sid);S.stepDone[d][id]=[...arr];
  const all=x.steps.every(s=>arr.has(s.id));if(all&&S.taskDone[d][id]==null)S.taskDone[d][id]=x.xp;if(!all&&S.taskDone[d][id]!=null)delete S.taskDone[d][id];
  if(!Object.keys(S.taskDone[d]).length)delete S.taskDone[d];
 },x.name,ev);
}
function stopTimer(save,ev){
 const T=S.timer;if(!T)return;let ms=timerElapsed();if(T.mode==="pomo")ms=Math.min(ms,T.pomo*6e4);
 const min=Math.floor(ms/6e4);
 if(save&&min>=1){act(()=>{S.timer=null;S.sessions.push({id:uid(),s:T.subject,start:T.began,end:Date.now(),min})},`Studied ${subjOf(T.subject).name}`,ev,[new Date(T.began).getFullYear()]);toast(`Saved ${fmtMin(min)} of ${subjOf(T.subject).name}`)}
 else{S.timer=null;commit();if(save)toast("Under a minute, so it wasn't saved")}
}

 taskEdit:el=>taskSheet(S.tasks.find(x=>x.id===el.dataset.id)),
 taskToggle:(el,ev)=>toggleTask(el.dataset.id,ev),
 stepToggle:(el,ev)=>toggleStep(el.dataset.id,el.dataset.s,ev),
 taskOpen:el=>{UI.open[el.dataset.id]=!UI.open[el.dataset.id];render()},
 taskDay:el=>{const n=Number(el.dataset.n);UI.taskDate=n?addDays(UI.taskDate,n):today();render()},
 mode:el=>{UI.mode=el.dataset.m;render()},
 pickSubject:el=>{UI.subject=el.dataset.id;render()},
 tStart:()=>{if(!UI.subject)return;const n=Date.now();S.timer={subject:UI.subject,mode:UI.mode,pomo:25,accum:0,running:true,startedAt:n,began:n};sfx("up");commit()},
 tPause:()=>{const T=S.timer;T.accum+=Date.now()-T.startedAt;T.running=false;commit()},
 tResume:()=>{const T=S.timer;T.startedAt=Date.now();T.running=true;commit()},
 tStop:(el,ev)=>stopTimer(true,ev),
 tDiscard:()=>{if(UI.armed==="discard"){UI.armed=null;S.timer=null;commit();toast("Session discarded")}else{UI.armed="discard";render();setTimeout(()=>{if(UI.armed==="discard"){UI.armed=null;render()}},3000)}},
 subjectNew:()=>subjectSheet(),
 subjectEdit:el=>subjectSheet(S.subjects.find(x=>x.id===el.dataset.id)),
 sessionNew:()=>sessionSheet(),
 sessionDel:(el,ev)=>{const id=el.dataset.id;if(UI.armed===id){const x=S.sessions.find(s=>s.id===id);UI.armed=null;if(x)act(()=>{S.sessions=S.sessions.filter(s=>s.id!==id)},null,ev,[new Date(x.start).getFullYear()])}else{UI.armed=id;render();setTimeout(()=>{if(UI.armed===id){UI.armed=null;render()}},3000)}},
 eventNew:()=>eventSheet(),
 impOpen:el=>{UI.schedDate=el.dataset.d;UI.schedView="week";store.set("lul-sview","week");goTab("schedule")},
 schedView:el=>{UI.schedView=el.dataset.v;store.set("lul-sview",UI.schedView);render()},
 monthDay:el=>{UI.schedDate=el.dataset.d;UI.schedView="week";store.set("lul-sview","week");render();window.scrollTo(0,0)},
 schedMonth:el=>{const n=Number(el.dataset.n);if(!n)UI.schedDate=today();else{const d=parse(UI.schedDate);UI.schedDate=ymd(new Date(d.getFullYear(),d.getMonth()+n,1))}render()},
 eventEdit:el=>eventSheet(S.events.find(x=>x.id===el.dataset.id)),
 schedDay:el=>{UI.schedDate=el.dataset.d;render()},
 schedWeek:el=>{const n=Number(el.dataset.n);UI.schedDate=n?addDays(UI.schedDate,n):today();render()}
};
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el||el.closest("#sheetRoot"))return;
 const f=H[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
let focusT=null;
document.addEventListener("input",e=>{if(e.target.id==="focusIn"){const v=e.target.value;clearTimeout(focusT);focusT=setTimeout(()=>{S.focus={[today()]:v};S.updatedAt=Date.now();saveLocal();dirtyCore=true;scheduleRemote()},700)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheetRoot").hidden)closeSheet();if(e.key==="Enter"&&e.target.id==="focusIn")e.target.blur()});
document.addEventListener("focusout",e=>{if(e.target.id==="focusIn")setTimeout(render,0)});

/* ---------- ticking timer ---------- */
let lastDay=today();
setInterval(()=>{
 if(today()!==lastDay){lastDay=today();UI.taskDate=today();render()}
 const T=S.timer;if(!T)return;
 const el=timerElapsed();
 if(T.mode==="pomo"&&el>=T.pomo*6e4){sfx("bell");toast("Pomodoro complete. Take a 5 minute break.");stopTimer(true);return}
 if(UI.tab==="study"&&T.running){const c=$("#tClock"),r=$("#tRing");if(c)c.textContent=fmtClock(T.mode==="pomo"?T.pomo*6e4-el:el);if(r){const C=2*Math.PI*96,fr=T.mode==="pomo"?el/(T.pomo*6e4):(el%36e5)/36e5;r.setAttribute("stroke-dashoffset",C*(1-clamp(fr,0,1)))}}
},1000);

render();
})();
</script>

</body>
</html>
